<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kajian Remaja - Masjid Nurul Ilmi</title>
    <meta property="og:title" content="Kajian Remaja - Masjid Nurul Ilmi">
    <meta name="theme-color" content="#0b3d40">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b3d40;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            font-family: system-ui, sans-serif;
            color: #fff
        }

        #wrap {
            width: 100%;
            max-width: 520px;
            text-align: center
        }

        #flyer {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
            display: none
        }

        .btn {
            display: none;
            margin: 12px 0;
            padding: 12px 24px;
            background: #1a9088;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold
        }

        #msg {
            margin-top: 38vh;
            opacity: .85
            font-weight: bold;
        }
    </style>
    <!-- TAMBAHAN:START (css) -->
    <style>
        #extra { width: 100%; max-width: 520px; text-align: left }
        .x-sec { background: rgba(255, 255, 255, .07); border-radius: 10px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 20px rgba(0, 0, 0, .25) }
        .x-sec h2 { margin: 0 0 8px; font-size: 17px; letter-spacing: .5px; text-align: center }
        .x-sec p { margin: 6px 0; font-size: 14px; line-height: 1.5; opacity: .9; white-space: pre-line }
        .x-meta { font-size: 13px; opacity: .85; margin: 3px 0 }
        .x-btn { display: inline-block; margin: 10px 0 0; padding: 10px 20px; background: #1a9088; color: #fff; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px }
        .x-c { text-align: center }
        .x-item { border-top: 1px solid rgba(255, 255, 255, .12); padding: 10px 0 }
        .x-item:first-of-type { border-top: 0 }
        .x-item b { font-size: 15px }
        .x-alb { margin: 10px 0 }
        .x-alb h3 { margin: 0 0 6px; font-size: 14px }
        .x-alb small { opacity: .75; font-weight: normal }
        .x-gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px }
        .x-gal img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; display: block; cursor: pointer; background: #072a2c }
        .x-foot { text-align: center; font-size: 13px; opacity: .9; padding: 14px 0 20px }
        .x-foot a { color: #fff; margin: 0 8px; text-decoration: underline }
        #xlb { position: fixed; inset: 0; background: rgba(0, 0, 0, .88); display: none; align-items: center; justify-content: center; z-index: 50; padding: 12px }
        #xlb img { max-width: 100%; max-height: 100%; border-radius: 8px }
    </style>
    <!-- TAMBAHAN:END (css) -->
</head>

<body>
    <div id="wrap">
        <p id="msg">Memuat flyer...</p>
        <a id="open" target="_blank" rel="noopener"><img id="flyer" alt="Flyer Kajian Remaja"></a>
        <a id="dl" class="btn" target="_blank" rel="noopener">Simpan Flyer</a>
    </div>

    <!-- TAMBAHAN:START (html) -->
    <div id="extra"></div>
    <div id="xlb"><img alt=""></div>
    <!-- TAMBAHAN:END (html) -->

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxdzHa0tN2Rep8SdAcAaihwAHsNzA5ypYBEFBCL9FNCwzrzebz2ycaQVLFBqunie75O/exec'; // URL web app GAS (/exec)
        const CACHE_KEY = 'flyer_latest';
        const $ = id => document.getElementById(id);

        function tampil(d) {
            const main = 'https://lh3.googleusercontent.com/d/' + d.id + '=w1600?t=' + d.updated;
            const alt = 'https://drive.google.com/thumbnail?id=' + d.id + '&sz=w1600&t=' + d.updated;
            const img = $('flyer');
            let tried = false;

            img.onload = () => {
                $('msg').style.display = 'none';
                img.style.display = 'block';
                $('dl').style.display = 'inline-block';
            };
            img.onerror = () => {
                if (!tried) { tried = true; img.src = alt; }
                else if (img.style.display !== 'block') $('msg').textContent = 'Gagal memuat flyer. Coba lagi.';
            };
            img.src = main;

            $('open').href = 'https://drive.google.com/uc?export=view&id=' + d.id;
            $('dl').href = 'https://drive.google.com/uc?export=download&id=' + d.id;
        }

        // tampilkan cache dulu biar cepat, lalu cek yang terbaru
        try {
            const c = JSON.parse(localStorage.getItem(CACHE_KEY));
            if (c && c.id) tampil(c);
        } catch (e) { }

        fetch(API_URL)
            .then(r => r.json())
            .then(d => {
                if (!d.ok) { $('msg').textContent = d.msg || 'Flyer belum tersedia.'; return; }
                let same = false;
                try {
                    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
                    same = c && c.id === d.id && c.updated === d.updated;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(d));
                } catch (e) { }
                if (!same) tampil(d);
            })
            .catch(() => {
                if ($('flyer').style.display !== 'block') $('msg').textContent = 'Gagal memuat flyer. Coba lagi.';
            });
    </script>
    <!-- TAMBAHAN:START (js) -->
    <script>
        (function () {
            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const url = u => /^https?:\/\//i.test(u || '') ? esc(u) : '';
            const fd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : (s || ''); };
            const ft = s => /^\d{1,2}:\d{2}$/.test(s || '') ? s.replace(':', '.') + ' WIB' : (s || '');
            const img = (fid, w) => 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(fid) + '=w' + w;
            const meta = (d, t, l) => [d && fd(d), t && ft(t), l].filter(Boolean).map(x => '<div class="x-meta">' + esc(x) + '</div>').join('');

            function render(d) {
                const st = d.settings || {}; let h = '';

                if (st.event_active === 'TRUE' && st.event_title) {
                    h += '<section class="x-sec"><h2>' + esc(st.event_title) + '</h2>' +
                        (st.event_desc ? '<p>' + esc(st.event_desc) + '</p>' : '') +
                        meta(st.event_date, st.event_time, st.event_location) +
                        (st.event_info ? '<p>' + esc(st.event_info) + '</p>' : '') +
                        (url(st.event_reg_url) ? '<div class="x-c"><a class="x-btn" target="_blank" rel="noopener" href="' + url(st.event_reg_url) + '">Daftar</a></div>' : '') +
                        '</section>';
                }

                const w = d.workshop;
                if (w && (w.title || w.description)) {
                    h += '<section class="x-sec"><h2>' + esc(w.title || 'WORKSHOP PEMUDA') + '</h2>' +
                        (w.description ? '<p>' + esc(w.description) + '</p>' : '') +
                        meta(w.date, w.time, w.location) +
                        (url(w.registration_url) ? '<div class="x-c"><a class="x-btn" target="_blank" rel="noopener" href="' + url(w.registration_url) + '">Daftar Workshop</a></div>' : '') +
                        '</section>';
                }

                if (d.kegiatan && d.kegiatan.length) {
                    h += '<section class="x-sec"><h2>JADWAL KEGIATAN</h2>' + d.kegiatan.map(k =>
                        '<div class="x-item"><b>' + esc(k.title) + '</b>' + meta(k.date, k.time, k.location) +
                        (k.description ? '<p>' + esc(k.description) + '</p>' : '') + '</div>').join('') + '</section>';
                }

                if (d.dokumentasi && d.dokumentasi.length) {
                    h += '<section class="x-sec"><h2>DOKUMENTASI</h2>' + d.dokumentasi.map(a =>
                        '<div class="x-alb"><h3>' + esc(a.title) + (a.date ? ' <small>• ' + esc(fd(a.date)) + '</small>' : '') + '</h3><div class="x-gal">' +
                        a.photos.map(p => '<img loading="lazy" alt="' + esc(a.title) + '" src="' + img(p.fid, 500) + '" data-big="' + img(p.fid, 1600) + '">').join('') +
                        '</div></div>').join('') + '</section>';
                }

                const links = [];
                if (st.instagram) links.push('<a target="_blank" rel="noopener" href="' + (/^https?:/i.test(st.instagram) ? url(st.instagram) : 'https://instagram.com/' + encodeURIComponent(st.instagram.replace(/^@/, ''))) + '">Instagram</a>');
                if (st.whatsapp) { const n = st.whatsapp.replace(/\D/g, '').replace(/^0/, '62'); if (n) links.push('<a target="_blank" rel="noopener" href="https://wa.me/' + n + '">WhatsApp</a>'); }
                if (url(st.social_link)) links.push('<a target="_blank" rel="noopener" href="' + url(st.social_link) + '">Link</a>');
                if (st.location) links.push('<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(st.location) + '">Lokasi</a>');
                if (links.length) h += '<footer class="x-foot">' + (st.location ? '<div>' + esc(st.location) + '</div>' : '') + '<div style="margin-top:6px">' + links.join('') + '</div></footer>';

                document.getElementById('extra').innerHTML = h;
            }

            document.getElementById('extra').addEventListener('click', e => {
                const b = e.target.dataset && e.target.dataset.big; if (!b) return;
                const lb = document.getElementById('xlb'); lb.firstElementChild.src = b; lb.style.display = 'flex';
            });
            document.getElementById('xlb').onclick = function () { this.style.display = 'none'; this.firstElementChild.src = ''; };

            fetch(API_URL + '?action=public').then(r => r.json()).then(d => { if (d && d.ok) render(d); }).catch(() => { });
        })();
    </script>
    <!-- TAMBAHAN:END (js) -->
</body>

</html>
